.eb{font-family:Montserrat,Arial,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--lil)}
h2{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.025em;line-height:1.12;margin:8px 0 0;color:#fff}
.g{background:linear-gradient(90deg,#C4B5FD,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:8px 0 0;max-width:62ch}
.logo{position:absolute;top:40px;right:44px;height:22px;opacity:.9}

.scen{margin-top:26px}
.scen-l{font-size:13px;color:var(--mute);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 13.5px Inter,Arial,sans-serif;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--cardline);
  border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:rgba(205,174,255,.5)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(106,0,255,.3)}

.flow{display:grid;grid-template-columns:1fr 44px 1fr 44px 1fr 44px .82fr;grid-template-rows:auto 48px auto;margin-top:26px;align-items:stretch}
.card{background:var(--cardbg);border:1px solid var(--cardline);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:opacity .25s,border-color .25s,background .25s,box-shadow .25s}
.q{padding:16px 16px 14px;display:flex;flex-direction:column}
.q .num{font-family:Montserrat,Arial,sans-serif;font-weight:900;font-size:24px;line-height:1}
.q .t{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:17px;margin-top:6px;color:#fff}
.q .d{font-size:14px;color:var(--mute);margin-top:4px;flex:1}
.q .state{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-top:8px;min-height:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.seg button{font:700 13px Inter,Arial,sans-serif;border-radius:9px;padding:8px 0;cursor:pointer;border:1px solid var(--cardline);background:transparent;color:var(--mute)}
.seg button:hover{color:#fff;border-color:rgba(205,174,255,.45)}
.seg .y[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.seg .n[aria-pressed="true"]{background:rgba(244,63,94,.18);color:#fff;border-color:rgba(244,63,94,.6)}
.q.passed{border-color:rgba(139,92,246,.55)}
.q.exit{border-color:rgba(244,63,94,.6);box-shadow:0 0 0 1px rgba(244,63,94,.25)}
.q.unreached{opacity:.42}

.arr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim);transition:color .25s}
.arr svg{display:block}
.arr line,.arr path,.dn line,.dn path{stroke:currentColor;stroke-width:1.7;fill:none}
.arr.on{color:var(--lil)}
.dn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim);transition:color .25s}
.dn.on{color:var(--redsoft)}

.o{padding:16px 18px;display:flex;gap:14px;align-items:center;opacity:.4}
.o .k{font-family:Montserrat,Arial,sans-serif;font-weight:900;font-size:21px;letter-spacing:-.01em;flex:none}
.o .v{font-size:14px;color:var(--txt)}
.o.act{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.o.act .k{color:#fff}
.o.ask .k{color:var(--lil)}
.o.stop .k{color:var(--redsoft)}
.o.on{opacity:1}
.o.act.on{background:var(--grad);border-color:transparent;box-shadow:0 12px 28px rgba(106,0,255,.35)}
.o.ask.on{background:rgba(106,0,255,.2);border-color:rgba(139,92,246,.75);box-shadow:0 12px 28px rgba(106,0,255,.22)}
.o.stop.on{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.7)}

.why{margin-top:18px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(205,174,255,.14);font-size:14.5px;color:var(--txt)}
.why b{color:#fff;font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;font-size:12.5px;color:var(--mute)}
.reset{white-space:nowrap;flex:none;font:600 12.5px Inter,Arial,sans-serif;color:var(--lil);background:none;border:0;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

button:focus-visible{outline:2px solid var(--lil);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .wrap{padding:28px 20px 22px;border-radius:12px}
  h2{font-size:27px}
  .logo{position:static;display:block;margin-bottom:18px;height:20px}
  .flow{grid-template-columns:1fr;grid-template-rows:none}
  .flow>*{grid-column:1 !important;grid-row:auto !important}
  .arr{height:34px;flex-direction:row;gap:8px}
  .arr svg{transform:rotate(90deg)}
  .dn{display:none}
  .o{margin-top:10px}
  .o.act{order:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

  <div class="eb">Three questions to draw the line</div>
  <h2>Act, ask or <span class="g">stop</span></h2>
  <p class="sub">Pick a decision, or answer the questions yourself, and see where the agent lands.</p>

  <div class="scen">
    <div class="scen-l" id="scen-l">Try a decision</div>
    <div class="chips" role="group" aria-labelledby="scen-l" id="chips"></div>
  </div>

  <div class="flow" id="flow"></div>
  <div class="why" id="why" aria-live="polite"></div>

  <div class="foot">
    <span>The right humans in the loop, not humans in the way</span>
    <button class="reset" id="reset" type="button">Start again</button>
  </div>
</div>

<script>
const QS=[
  {id:'impact',n:'01',t:'Impact',d:'Within budget and service-level limits?',no:'it’s outside the agent’s budget or service-level limits'},
  {id:'undo',n:'02',t:'Reversible',d:'Easy to undo, with no safety or compliance risk?',no:'it can’t be easily undone, or it touches safety or compliance'},
  {id:'policy',n:'03',t:'Policy',d:'Within your purchasing rules?',no:'it breaks one of your purchasing rules'}
];
const SC=[
  {id:'2am',l:'The 2 a.m. supplier switch',a:[false,true,true],note:'The other supplier can deliver on time, but the price is above the agent’s limit. It sends the option, with its reasoning, to the right manager.'},
  {id:'replen',l:'Replenish within approved limits',a:[true,true,true],note:'A routine order inside approved limits. The agent places it and logs what it did.'},
  {id:'reroute',l:'Reroute above the cost cap',a:[false,true,true],note:'The reroute costs more than the agreed cap, so the agent asks before it acts.'},
  {id:'contract',l:'Sign a new supplier contract',a:[true,false,true],note:'The value may be within limits, but a contract isn’t easy to unwind. A named person approves it.'},
  {id:'unvetted',l:'Order from an unvetted supplier',a:[true,true,false],note:'It might be the fastest fix, but procurement never cleared this supplier. The agent can’t act.'}
];
const OUT={
  act:{k:'Act',v:'The agent acts and logs why.'},
  ask:{k:'Ask',v:'The agent recommends, with its reasoning. A named person approves.'},
  stop:{k:'Stop',v:'Policy wins. A person decides.'}
};
const DEFAULT='2am';
let state={scen:DEFAULT,a:[...SC[0].a]};

const RIGHT='<svg width="38" height="14" aria-hidden="true"><line x1="2" y1="7" x2="31" y2="7"/><path d="M29 2 L37 7 L29 12"/></svg>';
const DOWN='<svg width="14" height="30" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="22"/><path d="M2 20 L7 28 L12 20"/></svg>';

function build(){
  document.getElementById('chips').innerHTML=SC.map(s=>`<button type="button" class="chip" data-s="${s.id}" aria-pressed="false">${s.l}</button>`).join('');
  const f=document.getElementById('flow');
  let h='';
  QS.forEach((q,i)=>{
    const col=1+i*2;
    h+=`<div class="card q" id="q${i}" style="grid-column:${col};grid-row:1" role="group" aria-labelledby="qt${i}">
      <div class="num g">${q.n}</div><div class="t" id="qt${i}">${q.t}</div><div class="d">${q.d}</div>
      <div class="seg"><button type="button" class="y" data-q="${i}" data-v="1" aria-pressed="false">Yes<span class="sr"> to ${q.t}</span></button><button type="button" class="n" data-q="${i}" data-v="0" aria-pressed="false">No<span class="sr"> to ${q.t}</span></button></div>
      <div class="state" id="st${i}"></div></div>`;
    h+=`<div class="arr" id="ar${i}" style="grid-column:${col+1};grid-row:1"><span>YES</span>${RIGHT}</div>`;
    h+=`<div class="dn" id="dn${i}" style="grid-column:${col};grid-row:2">${DOWN}<span>NO</span></div>`;
  });
  h+=`<div class="card o act" id="o-act" style="grid-column:7;grid-row:1"><span class="k">${OUT.act.k}</span><span class="v">${OUT.act.v}</span></div>`;
  h+=`<div class="card o ask" id="o-ask" style="grid-column:1 / 4;grid-row:3"><span class="k">${OUT.ask.k}</span><span class="v">${OUT.ask.v}</span></div>`;
  h+=`<div class="card o stop" id="o-stop" style="grid-column:5 / 8;grid-row:3"><span class="k">${OUT.stop.k}</span><span class="v">${OUT.stop.v}</span></div>`;
  f.innerHTML=h;
}

function compute(){
  const a=state.a;
  // Walk the questions in order; the first "No" decides the outcome.
  let exit=-1;
  for(let i=0;i<QS.length;i++){ if(!a[i]){exit=i;break;} }
  const outcome = exit===-1 ? 'act' : (QS[exit].id==='policy' ? 'stop' : 'ask');

  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.s===state.scen)));
  QS.forEach((q,i)=>{
    const el=document.getElementById('q'+i);
    const reached = exit===-1 || i<=exit;
    el.classList.toggle('unreached',!reached);
    el.classList.toggle('exit',i===exit);
    el.classList.toggle('passed',reached && a[i]);
    el.querySelector('.y').setAttribute('aria-pressed',String(a[i]));
    el.querySelector('.n').setAttribute('aria-pressed',String(!a[i]));
    document.getElementById('st'+i).textContent = !reached ? 'Not reached' : (a[i] ? 'Passed' : 'Stops here');
    document.getElementById('ar'+i).classList.toggle('on', reached && a[i]);
    document.getElementById('dn'+i).classList.toggle('on', i===exit);
  });
  ['act','ask','stop'].forEach(k=>document.getElementById('o-'+k).classList.toggle('on',k===outcome));

  const sc=SC.find(s=>s.id===state.scen);
  let why = exit===-1
    ? `<b>Act.</b> All three checks pass, so the agent acts inside its boundaries and logs what it did.`
    : `<b>${OUT[outcome].k}.</b> The flow stops at question ${QS[exit].n} because ${QS[exit].no}.`;
  if(sc) why += ` ${sc.note}`;
  document.getElementById('why').innerHTML=why;
  postHeight();
}

function postHeight(){
  try{ parent.postMessage({agentraEmbedHeight:Math.ceil(document.documentElement.scrollHeight)},'*'); }catch(e){}
}

document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){ const s=SC.find(x=>x.id===c.dataset.s); state={scen:s.id,a:[...s.a]}; compute(); return; }
  const b=e.target.closest('.seg button');
  if(b){ state.a[+b.dataset.q]=b.dataset.v==='1'; state.scen=null;
    compute(); return; }
  if(e.target.id==='reset'){ const s=SC.find(x=>x.id===DEFAULT); state={scen:s.id,a:[...s.a]}; compute(); }
});
if('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.body);

build(); compute();
</script>
</body>
</html>
